spring:
  application:
    name: playwright-tester

app:
  login:
    username: 
    password: 
    session-timeout: 10800
  crypto:
    secret-key: ${APP_CRYPTO_SECRET_KEY:}
    
server:
  port: ${SERVER_PORT:8888}

playwright:
  headless: true
  timeout: 30000
  browser: chromium

screenshot:
  cleanup:
    enabled: false      # 자동 정리 활성화 여부
    retain-days: 7     # N일 이상 된 파일 삭제
